<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Core Rope block diagram</title>
  <desc id="desc">Assembler weaves a 16 by 12 core plane. A program counter selects one word line. Sense windings fill a 12-bit latch that control fetches. The accumulator reads and writes shadow RAM. Nothing writes back into the core plane.</desc>
  <rect width="1120" height="680" fill="#eceae4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0c0d0f"/>
    </marker>
    <marker id="arrow-steel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5c6b78"/>
    </marker>
    <style>
      .box { fill: #f6f4ee; stroke: #0c0d0f; stroke-width: 1; }
      .name { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0c0d0f; }
      .sub { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #3e4650; }
      .wire { fill: none; stroke: #0c0d0f; stroke-width: 1.25; marker-end: url(#arrow); }
      .boot { fill: none; stroke: #5c6b78; stroke-width: 1.25; stroke-dasharray: 4 3; marker-end: url(#arrow-steel); }
      .tag { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #3e4650; }
      .ban { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #8a4e22; }
    </style>
  </defs>

  <rect class="box" x="40" y="48" width="200" height="70"/>
  <text class="name" x="56" y="76">Assembler</text>
  <text class="sub" x="56" y="98">two pass, 16 words</text>

  <rect class="box" x="360" y="36" width="280" height="94"/>
  <text class="name" x="376" y="68">Core plane</text>
  <text class="sub" x="376" y="90">16 word lines × 12 cores</text>
  <text class="sub" x="376" y="110">through = 1, around = 0</text>

  <rect class="box" x="780" y="48" width="300" height="70"/>
  <text class="name" x="796" y="76">Verify</text>
  <text class="sub" x="796" y="98">through-cores rebuild the word</text>

  <rect class="box" x="40" y="210" width="160" height="64"/>
  <text class="name" x="56" y="236">Program counter</text>
  <text class="sub" x="56" y="256">address 0–15</text>

  <rect class="box" x="270" y="210" width="190" height="64"/>
  <text class="name" x="286" y="236">Decoder</text>
  <text class="sub" x="286" y="256">exactly one line</text>

  <rect class="box" x="530" y="210" width="170" height="64"/>
  <text class="name" x="546" y="236">Word driver</text>
  <text class="sub" x="546" y="256">current pulse</text>

  <rect class="box" x="780" y="198" width="300" height="88"/>
  <text class="name" x="796" y="230">Sense cores</text>
  <text class="sub" x="796" y="252">12 windings</text>
  <text class="sub" x="796" y="270">coupled only if threaded</text>

  <rect class="box" x="40" y="400" width="200" height="84"/>
  <text class="name" x="56" y="432">Control</text>
  <text class="sub" x="56" y="454">opcode decode</text>
  <text class="sub" x="56" y="472">halt, 100-step limit</text>

  <rect class="box" x="310" y="412" width="170" height="64"/>
  <text class="name" x="326" y="438">Accumulator</text>
  <text class="sub" x="326" y="458">12 bits</text>

  <rect class="box" x="540" y="390" width="190" height="108"/>
  <text class="name" x="556" y="422">Shadow RAM</text>
  <text class="sub" x="556" y="444">16 × 12</text>
  <text class="sub" x="556" y="462">stores only</text>
  <text class="ban" x="556" y="482">no path to the cores</text>

  <rect class="box" x="780" y="412" width="300" height="70"/>
  <text class="name" x="796" y="440">Sense latch</text>
  <text class="sub" x="796" y="462">the fetched rope word</text>

  <line class="wire" x1="240" y1="83" x2="358" y2="83"/>
  <text class="tag" x="268" y="74">image</text>
  <line class="wire" x1="640" y1="83" x2="778" y2="83"/>
  <text class="tag" x="682" y="74">map</text>

  <path class="boot" d="M500 130 V228 C512 228 512 256 500 256 V360 H635 V388"/>
  <text class="tag" x="368" y="176">boot copy, once</text>

  <line class="wire" x1="200" y1="242" x2="268" y2="242"/>
  <text class="tag" x="206" y="232">addr</text>
  <line class="wire" x1="460" y1="242" x2="528" y2="242"/>
  <text class="tag" x="466" y="232">1 of 16</text>
  <line class="wire" x1="700" y1="242" x2="778" y2="242"/>

  <line class="wire" x1="930" y1="286" x2="930" y2="410"/>
  <text class="tag" x="938" y="356">12</text>

  <path class="wire" d="M930 482 V600 H140 V486"/>
  <text class="tag" x="470" y="590">12-bit readout</text>

  <line class="wire" x1="120" y1="398" x2="120" y2="276"/>
  <text class="tag" x="128" y="346">next / JMP / JZ</text>

  <line class="wire" x1="240" y1="444" x2="308" y2="444"/>
  <text class="tag" x="250" y="436">op</text>

  <line class="wire" x1="538" y1="430" x2="482" y2="430"/>
  <text class="tag" x="486" y="422">LDA / ADD</text>
  <line class="wire" x1="482" y1="458" x2="538" y2="458"/>
  <text class="tag" x="494" y="474">STA</text>

  <line x1="40" y1="652" x2="88" y2="652" stroke="#0c0d0f" stroke-width="1.25"/>
  <text class="tag" x="96" y="656">runtime</text>
  <line x1="180" y1="652" x2="228" y2="652" stroke="#5c6b78" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text class="tag" x="236" y="656">once, at boot</text>
</svg>
